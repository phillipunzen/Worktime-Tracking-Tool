{% extends "base.html" %}
{% block title %}Fehler {{ code }}{% endblock %}
{% block content %}
<div class="card empty">
  <h1>{{ code }}</h1>
  <p>{{ message }}</p>
  <a class="btn" href="{{ url_for('main.dashboard') }}">Zur Startseite</a>
</div>
{% endblock %}
{% block public %}
<div class="login-wrap"><div class="card login-card empty">
  <h1>{{ code }}</h1><p>{{ message }}</p>
  <a class="btn" href="{{ url_for('auth.login') }}">Zur Anmeldung</a>
</div></div>
{% endblock %}
