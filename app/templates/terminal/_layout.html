<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex">
  <title>{{ terminal.name if terminal else 'Stempelterminal' }} · {{ company_name }}</title>
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='terminal.css') }}">
</head>
<body class="kiosk" data-now="{{ now|iso if now }}" {% block body_attrs %}{% endblock %}>
  <header class="kiosk-head">
    <div class="kiosk-brand"><img src="{{ url_for('static', filename='icon.svg') }}" alt=""> {{ company_name }}</div>
    <div class="kiosk-clock"><span data-clock>{{ now|t if now }}</span><small>{{ now.date()|dw if now }}</small></div>
    <div class="kiosk-name">{{ terminal.name if terminal }}</div>
  </header>
  <main class="kiosk-main">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='terminal.js') }}"></script>
</body>
</html>
